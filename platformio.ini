; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_compat_mode = strict
lib_deps =
	ayushsharma82/ElegantOTA@^3.1.7
	bblanchon/ArduinoJson@^7.2.1
	someweisguy/esp_dmx@^4.1.0
	hideakitai/ArtNet@^0.8.0
	jandrassy/EthernetENC@^2.0.5

board_build.partitions = partitions_table.csv
board_build.filesystem = littlefs

; Default environment - USB upload
[env:wt32-eth01]

; OTA Upload environment - Change IP to your device's IP
[env:wt32-eth01-ota]
upload_protocol = custom
custom_upload_url = http://192.168.179.223/ 
extra_scripts = platformio_upload.py